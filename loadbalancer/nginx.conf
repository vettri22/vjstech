# ==============================================================================
# VJS TECH — Production NGINX Reverse Proxy & Load Balancer Configuration
# Domain: vjstech.in (or configured production domain)
# ==============================================================================

# Define upstream application cluster (load balancing across worker instances)
upstream vjstech_cluster {
    # Method: round-robin (default) or least_conn for distributed connection loads
    least_conn;
    
    # Primary application instances (clustered or distributed across ports/hosts)
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:5001 backup; # Optional standby instance

    keepalive 32;
}

# Dedicated rate limiting zones to mitigate DDoS and brute-force attacks
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=120r/m;

# ------------------------------------------------------------------------------
# 1. HTTP Server — Automatic 301 Redirect to HTTPS Padlock
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name vjstech.in www.vjstech.in;

    # Let's Encrypt / ACME challenge verification path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Strict 301 Permanent Redirect to HTTPS Padlock (Item 10)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server — Secure Padlock & Production Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vjstech.in www.vjstech.in;

    # SSL Certificates (Configure with valid Let's Encrypt / CA certs)
    ssl_certificate /etc/letsencrypt/live/vjstech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vjstech.in/privkey.pem;

    # Modern TLS Security & Hardened Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers (Grade A+ SSL Padlock)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # High-Performance Gzip Compression (Fast Loading)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Static Assets Caching & Cache-Busting
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|webp)$ {
        proxy_pass http://vjstech_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Strict Rate-Limited Login Route (Authentication Defense)
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://vjstech_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # General API Routes Rate Limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://vjstech_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Health Check Endpoint for Upstream Monitoring
    location = /api/health {
        proxy_pass http://vjstech_cluster;
        access_log off;
    }

    # Default Route — Load Balancer Proxy to Node Cluster
    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://vjstech_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Buffer and timeout controls
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
