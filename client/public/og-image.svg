    <text x="245" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">AI &amp; Data Analytics</text>

    <!-- Pill 3 -->
