  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#00E5FF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Monogram Brand Icon -->
  <g transform="translate(100, 90)">
    <rect width="72" height="72" rx="14" fill="#0B0B0E" stroke="#2D2D3F" stroke-width="2"/>
    <path d="M15 18L36 57L44 41L26 18H15Z" fill="#3B0A6B"/>
    <path d="M57 18L36 57L39 57L57 26V18Z" fill="#00E5FF"/>
    <circle cx="51" cy="21" r="3.5" fill="#00E5FF"/>
  </g>

  <!-- Agency Brand Text -->
  <text x="190" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="2">VJS <tspan fill="#00E5FF">TECH</tspan></text>
  <text x="190" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#64748B" letter-spacing="1">FREELANCE SOFTWARE SOLUTIONS AGENCY &bull; INDIA</text>

  <!-- Headline -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" letter-spacing="-1">
