services:
  - type: web
    name: vjstech
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://vjstech.in,https://vjstech.onrender.com
    disk:
      name: vjstech-data
      mountPath: /app/server/data
      sizeGB: 1
